<div class="wb-wrap" id="wbWrap">

  <!-- ═══ SIDEBAR: серверы ═══ -->
  <aside class="wb-side" id="wbSide">
    <div class="wb-side-head">
      <span class="wb-side-title">Продвижение WB</span>
      <div class="wb-side-actions">
        <button class="wb-ico-btn" id="wbDemoToggle" onclick="WB.toggleTestServer()" title="Тестовый сервер">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </button>
        <button class="wb-ico-btn" onclick="WB.addServer()" title="Добавить сервер">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div class="wb-side-list" id="wbServerList"></div>
    <div class="wb-side-foot" id="wbSideFoot"><b>0</b> / 0 онлайн</div>
  </aside>

  <!-- затемнение+блюр модуля когда открыт сайдбар серверов -->
  <div class="wb-backdrop" id="wbBackdrop" onclick="WB.closeSide()"></div>

  <!-- ═══ MAIN ═══ -->
  <div class="wb-main">
    <div class="wb-head">
      <div class="wb-head-card">
        <div class="wb-hd-left">
          <button class="wb-hd-srv" onclick="WB.toggleSide()" title="Серверы">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          </button>
          <span class="wb-hd-dot" id="wbHeadDot"></span>
          <span class="wb-hd-name" id="wbHeadName">Сервер не выбран</span>
        </div>
        <div class="wb-hd-seg" id="wbTabs" role="tablist">
          <button class="wb-hd-tab active" data-tab="accounts"  onclick="WB.switchTab('accounts')" role="tab">Аккаунты</button>
          <button class="wb-hd-tab" data-tab="reg"       onclick="WB.switchTab('reg')" role="tab">Регистратор</button>
          <button class="wb-hd-tab" data-tab="warmup"    onclick="WB.switchTab('warmup')" role="tab">Прогрев</button>
          <button class="wb-hd-tab" data-tab="purchases" onclick="WB.switchTab('purchases')" role="tab">Покупки</button>
          <button class="wb-hd-tab" data-tab="pickup"    onclick="WB.switchTab('pickup')" role="tab">Получение</button>
          <button class="wb-hd-tab" data-tab="reviews"   onclick="WB.switchTab('reviews')" role="tab">Отзывы</button>
          <button class="wb-hd-tab" data-tab="stats"     onclick="WB.switchTab('stats')" role="tab">Статистика</button>
        </div>
        <div class="wb-hd-count" id="wbHeadCount"></div>
      </div>
    </div>

    <div class="wb-ws" id="wbWorkspace">
      <div class="wb-pane active" id="wbPane-accounts"></div>
      <div class="wb-pane" id="wbPane-reg"></div>
      <div class="wb-pane" id="wbPane-warmup"></div>
      <div class="wb-pane" id="wbPane-purchases"></div>
      <div class="wb-pane" id="wbPane-pickup"></div>
      <div class="wb-pane" id="wbPane-reviews"></div>
      <div class="wb-pane" id="wbPane-stats"></div>
    </div>
  </div>

  <!-- модалка -->
  <div class="wb-modal-ov" id="wbModal" onclick="if(event.target===this)WB.closeModal()">
    <div class="wb-modal" id="wbModalBox"></div>
  </div>
</div>
